<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanzas Hogar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Finanzas Hogar</title>
  </head>
  <body>
    <div id="root">
      <main id="startup-message" style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px system-ui,sans-serif">
        <p>Iniciando Finanzas Hogar…</p>
      </main>
    </div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById("root");
          if (!root?.querySelector("#startup-message")) return;
          root.innerHTML = `<main style="min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px system-ui,sans-serif"><section style="max-width:560px"><h1 style="font-size:24px">No se pudo iniciar la aplicación</h1><p style="white-space:pre-wrap;color:#475569">${String(message).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char])}</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#a6ff00;font-weight:700">Volver a intentar</button></section></main>`;
        };
        window.addEventListener("error", (event) => showStartupError(event.message || "Error al cargar un recurso."));
        window.addEventListener("unhandledrejection", (event) => showStartupError(event.reason?.message || String(event.reason || "Error inesperado.")));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
